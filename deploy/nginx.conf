# Konfiguracja nginx jako reverse proxy przed aplikacją (Next.js słucha
# tylko na 127.0.0.1:3000, patrz deploy/wedding-app.service). Skopiuj na
# serwer do /etc/nginx/sites-available/wedding-app, podmień TWOJA-DOMENA,
# potem:
#   sudo ln -s /etc/nginx/sites-available/wedding-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TWOJA-DOMENA   # dopisze blok HTTPS (443) sam
#
# Patrz deploy/DEPLOY.md po pełne kroki.

server {
    listen 80;
    listen [::]:80;
    server_name TWOJA-DOMENA;

    # WAŻNE: domyślny limit nginx (1 MB) jest MNIEJSZY niż
    # MAX_UPLOAD_BYTES aplikacji (10 MB, patrz src/lib/photoStorage.ts) -
    # bez podniesienia tego limitu upload zdjęcia przez gościa/parę
    # kończyłby się błędem 413 z samego nginx, zanim żądanie w ogóle
    # dotarłoby do Next.js.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WAŻNE: aplikacja (src/app/z/[token]/route.ts) czyta te dwa
        # nagłówki, żeby zbudować publiczny adres przy przekierowaniu z
        # linku zaproszenia - bez nich (albo z błędną wartością)
        # przekierowanie prowadziłoby na wewnętrzny adres, pod którym
        # nasłuchuje Next.js (np. localhost:3000), zamiast na Twoją domenę.
        # Złapane empirycznie przy wdrożeniu za tunelem mikr.us - patrz
        # DEPLOY.md, sekcja "Test na mikr.us (wykr.es)".
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
